<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Boy Emulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="gameboy">
        <div class="gameboy-screen-container">
            <div class="screen-brand">
                <span>Nintendo</span>
                <span class="small">GAME BOY</span>
                <span>™</span>
            </div>
            <div class="screen-power">
                <div class="power-led"></div>
                <span>BATTERY</span>
            </div>
            <canvas id="screen" width="160" height="144"></canvas>
        </div>
        <div class="gameboy-controls">
            <div class="d-pad">
                <button id="btn-up" class="btn-direction">⯅</button>
                <button id="btn-left" class="btn-direction">⯇</button>
                <button id="btn-center" class="btn-direction"></button>
                <button id="btn-right" class="btn-direction">⯈</button>
                <button id="btn-down" class="btn-direction">⯆</button>
            </div>
            <div class="action-buttons">
                <button id="btn-b" class="btn-action">B</button>
                <button id="btn-a" class="btn-action">A</button>
            </div>
            <div class="system-buttons">
                <button id="btn-select" class="btn-system">SELECT</button>
                <button id="btn-start" class="btn-system">START</button>
            </div>
        </div>
        <div class="gameboy-speaker">
            <div class="speaker-hole"></div>
            <div class="speaker-hole"></div>
            <div class="speaker-hole"></div>
            <div class="speaker-hole"></div>
            <div class="speaker-hole"></div>
            <div class="speaker-hole"></div>
        </div>
    </div>
    <div class="controls-info">
        <h3>Controls:</h3>
        <p>D-Pad: Arrow Keys</p>
        <p>A: Z Key</p>
        <p>B: X Key</p>
        <p>Start: Enter Key</p>
        <p>Select: Shift Key</p>
        <p>Reset: R Key</p>
        <p>Pause/Resume: P Key</p>
        <button id="load-rom">Load ROM</button>
    </div>

    <script src="utils.js"></script>
    <script src="memory.js"></script>
    <script src="cpu.js"></script>
    <script src="gpu.js"></script>
    <script src="timer.js"></script>
    <script src="input.js"></script>
    <script src="emulator.js"></script>

</body>
</html>
